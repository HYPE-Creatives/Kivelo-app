name: KIVELO CI/CD (Frontend → GitHub Pages | Backend → Render)

on:
  push:
    branches: [dev-fatai]
  pull_request:
    branches: [dev-fatai]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  frontend:
    name: Build Frontend for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build frontend
        run: |
          cd kivelo-frontend
          npm install
          npx expo install react-dom react-native-web
          npx expo export -p web --output-dir dist
          cp public/404.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: kivelo-frontend/dist

  backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and test backend
        run: |
          cd kivelo-backend
          npm install
          npm test || echo "No tests, skipping"

  # Deploy only FRONTEND to GitHub Pages
  deploy_frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [frontend]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Frontend
        id: deployment
        uses: actions/deploy-pages@v4
